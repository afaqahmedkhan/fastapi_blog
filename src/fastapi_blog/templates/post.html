{% extends "layout.html" %}
{% block content %}
    <nav class="mb-6">
        <a href="{{ url_for('home') }}"
           class="inline-flex items-center gap-1 text-sm font-medium text-sky-600 hover:text-sky-500 dark:text-sky-400 dark:hover:text-sky-300">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
            Back to posts
        </a>
    </nav>
    <article class="rounded-2xl border border-zinc-200/80 bg-white p-8 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <div class="flex items-start gap-5">
            <img class="h-20 w-20 shrink-0 rounded-full object-cover ring-2 ring-zinc-100 dark:ring-zinc-800"
                 src="{{ post.author.image_path }}"
                 alt="{{ post.author.username }}'s profile picture"
                 width="80"
                 height="80">
            <div class="min-w-0 flex-1">
                <div class="mb-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
                    <a class="relative z-10 font-semibold text-sky-600 hover:text-sky-500 dark:text-sky-400 dark:hover:text-sky-300"
                       href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.username }}</a>
                    <time class="text-zinc-500 dark:text-zinc-400"
                          datetime="{{ post.date_posted.isoformat() }}">{{ post.date_posted.strftime("%B %d, %Y") }}</time>
                </div>
                <h1 class="font-display text-3xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50">{{ post.title }}</h1>
                <p class="mt-6 text-lg leading-relaxed text-zinc-600 dark:text-zinc-300">{{ post.content }}</p>
            </div>
        </div>
    </article>
{% endblock content %}

{% extends "layout.html" %}
{% block content %}
    <div class="mx-auto max-w-lg rounded-2xl border border-zinc-200/80 bg-white p-8 text-center shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <p class="font-display text-6xl font-bold text-zinc-300 dark:text-zinc-600">{{ status_code }}</p>
        <h1 class="mt-2 font-display text-2xl font-semibold text-zinc-900 dark:text-zinc-50">{{ heading }}</h1>
        <p class="mt-3 text-zinc-600 dark:text-zinc-400">{{ message }}</p>
        <a href="{{ url_for('home') }}"
           class="mt-8 inline-flex items-center justify-center rounded-lg bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-500 dark:bg-sky-500 dark:hover:bg-sky-400">
            Back to home
        </a>
    </div>
{% endblock content %}
